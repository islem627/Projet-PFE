<script>
  document.getElementById('messageDropdown').addEventListener('click', async function(e) {
      e.preventDefault();
  
      // Récupérer l'ID du livreur depuis localStorage
      const livreurId = localStorage.getItem('livreurId');
  
      if (!livreurId) {
          document.getElementById('clientList').innerHTML = '<p class="dropdown-item">Erreur : Livreur non identifié</p>';
          return;
      }
  
      try {
          // Appeler l'API pour récupérer les commandes
          const response = await fetch(`/commande/allByLivreurID/${livreurId}`, {
              method: 'GET',
              headers: {
                  'Accept': 'application/json',
                  'Content-Type': 'application/json'
                  // Ajouter un token si nécessaire, ex: 'Authorization': `Bearer ${localStorage.getItem('token')}`
              }
          });
  
          if (!response.ok) {
              throw new Error('Erreur lors de la récupération des commandes');
          }
  
          const commandes = await response.json();
  
          // Extraire les clients uniques (éviter les doublons par iduser)
          const clientsMap = new Map();
          commandes.forEach(commande => {
              if (commande.userDTO) {
                  clientsMap.set(commande.userDTO.id, commande.userDTO);
              }
          });
          const clients = Array.from(clientsMap.values());
  
          const clientList = document.getElementById('clientList');
          clientList.innerHTML = ''; // Vider la liste précédente
  
          if (clients.length === 0) {
              clientList.innerHTML = '<p class="dropdown-item">Aucun client à afficher</p>';
              return;
          }
  
          // Afficher chaque client dans la dropdown
          clients.forEach(client => {
              const clientItem = document.createElement('div');
              clientItem.className = 'dropdown-item';
              clientItem.innerHTML = `
                  <p><strong>${client.firstname} ${client.lastname}</strong></p>
                  <p>Téléphone: ${client.phone}</p>
                  <a href="/chat/${client.id}" class="btn btn-sm btn-primary">Contacter</a>
                  <hr>
              `;
              clientList.appendChild(clientItem);
          });
      } catch (error) {
          console.error('Erreur lors de la récupération des clients:', error);
          document.getElementById('clientList').innerHTML = '<p class="dropdown-item">Erreur de chargement</p>';
      }
  });
  </script>
